# Drop-in template for consumer repos (promaxhvac.com, hvacpulse.com).
# Place at: .github/workflows/autoblog-rewrite.yml
#
# User-initiated rewrite of a failed-review post. Triggered when the repo
# owner comments `/autoblog rewrite` on an autoblog PR. Loads the most
# recent ReviewResult artifact, asks Gemini for a focused revision, and
# pushes the revised post back to the PR branch — which retriggers the
# normal review workflow.
#
# Loop safety: this workflow runs ONCE per comment. There is no auto-retry
# path; the next move after a rewrite is always either a human action or
# the next weekly cron.

name: Autoblog AI Rewrite

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  rewrite:
    if: >-
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/autoblog rewrite')
      && github.event.comment.user.login == github.repository_owner
      && contains(github.event.issue.labels.*.name, 'autoblog-review-failed')
    runs-on: ubuntu-latest
    steps:
      - name: React to triggering comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # `gh pr checkout` needs an existing git repo to switch branches in;
      # without this checkout the workspace has no .git and it exits 1.
      #
      # Persist the AUTOBLOG_PAT (not the default GITHUB_TOKEN) as the push
      # credential: a push made with GITHUB_TOKEN does NOT retrigger the review
      # workflow (GitHub suppresses it to prevent loops), so the rewritten post
      # would never get re-reviewed. Falls back to GITHUB_TOKEN when the PAT is
      # unset (the push still works; re-review just won't auto-fire).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOBLOG_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr checkout "${{ github.event.issue.number }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Fetch latest review artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Find the most recent successful run of the review workflow on this PR's branch.
          BRANCH=$(gh pr view "$PR" --json headRefName -q .headRefName)
          RUN_ID=$(gh run list --workflow=autoblog-review.yml --branch "$BRANCH" \
            --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "No prior review run found for branch $BRANCH" >&2
            exit 1
          fi
          gh run download "$RUN_ID" --name autoblog-review

      - name: Identify the post
        id: files
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only \
            "origin/${{ github.event.repository.default_branch }}...HEAD" \
            | grep -E '^(content|src/content)/blog/.*\.md$' | head -n 1)
          echo "file=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run AI rewrite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx blog-engine-rewrite \
            --post "${{ steps.files.outputs.file }}" \
            --review review-result.json \
            --site pulse \
            --business "HVAC Pulse" \
            --service-areas "Sacramento,Roseville,Folsom,Elk Grove,Citrus Heights" \
            --notes-out change-notes.md

      # Build the site against the rewritten post BEFORE committing. A rewrite
      # that mangles frontmatter (e.g. drops a field the page template reads)
      # crashes the prerender; without this gate the broken post would be pushed
      # and only fail later in the PR's own build. Failing here means nothing is
      # pushed and the post is left in its prior state.
      - name: Validate rewritten post builds
        run: npm run build

      - name: Commit revision
        run: |
          set -euo pipefail
          git config user.name "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add "${{ steps.files.outputs.file }}"
          if git diff --cached --quiet; then
            echo "No changes from rewrite — model returned the same content."
            exit 0
          fi
          git commit -m "autoblog: AI rewrite addressing review feedback"
          git push

      - name: Post change-notes comment
        if: hashFiles('change-notes.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: change-notes.md
          header: autoblog-rewrite
