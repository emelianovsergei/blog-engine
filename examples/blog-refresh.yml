# Drop-in template for consumer repos (promaxhvac.com, hvacpulse.com).
# Place at: .github/workflows/blog-refresh.yml
# Needs scripts/refresh-blog-post.ts and scripts/test-refresh-fixtures.ts
# (examples/scripts/), their fixtures (examples/tests/fixtures/blog-refresh/)
# and the session commands in examples/scripts/autoblog/claude.ts.
#
name: Refresh Ranking Blog Post

# Weekly refresh of ONE published post: the URL with the most page-two Search
# Console impressions that has not been touched in a while gets its answer
# box, FAQs, keyword, sources and (lightly) its body refreshed against the
# queries it already ranks for, and an honest `updated:` date.
#
# The writer is the scheduled Claude session (subscription), never an API
# key. Two stages, like the daily post (blog-brief.yml → session →
# blog-finalize.yml):
#
#   brief     workflow_dispatch, sent by the Monday Pulse night routine
#             (`npm run autoblog:claude -- refresh-brief`, AUTOBLOG_CLAUDE.md).
#             Picks the post from Search Console and writes the engine's
#             prompt to the side branch `autoblog-refresh-brief`. No model call.
#   finalize  a push of data/blog-refresh-inbox/ to blog/refresh-* (the
#             session's `refresh-handoff`). Applies the session's answer with
#             the engine (same parsing and validation as a model reply),
#             repairs links, commits on top of main, marks the commit
#             `autoblog/finalized` and opens the PR as a Claude-reviewed post:
#             the Grok review and auto-fix skip it, the claude-reviewed job
#             approves it, and the routine's `publish` merges it.
#
# Nothing to refresh (no Search Console access, every post in its 120-day
# cooldown or with an open autoblog PR) is a brief with that status: no
# branch, no PR. Required setup: GSC_SERVICE_ACCOUNT_JSON, GSC_SITE_URL,
# AUTOBLOG_PAT. Labels: autoblog, autoblog-refresh, autoblog-claude-reviewed.

on:
  workflow_dispatch:
  push:
    branches:
      - "blog/refresh-*"
    paths:
      - "data/blog-refresh-inbox/**"

# One group for every workflow that selects and mutates EXISTING posts
# (refresh, backfill): their exclusion lists are read before a PR exists, so
# two overlapping runs could both pick the same post. Serializing them
# closes that window; the generate workflow only ever adds files.
concurrency:
  group: autoblog-mutate-existing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  brief:
    name: Pick the post and write the refresh prompt
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fixture-mode refresh
        run: npm run blog:test-refresh-fixtures

      # A post with an open autoblog PR (new, refresh or backfill) must not be
      # refreshed underneath that PR.
      - name: Collect slugs with open autoblog PRs
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail closed: an incomplete exclusion list could open a second PR
          # against a post another autoblog PR is already changing.
          # Selection has to match how the review workflow ADMITS a PR: the
          # `autoblog` label OR an `autoblog/*` head ref. A label-only query
          # would miss a head-ref PR and let this job pick a post that PR is
          # already changing.
          # --limit above gh's 30-per-page default: an unpaginated list on a busy day
          # could omit an older open PR and let two jobs pick the same post.
          if ! OPEN=$(gh pr list --state open --limit 500 --json number,labels,headRefName --jq '[.[] | select((.labels | map(.name) | index("autoblog")) or (.headRefName | startswith("autoblog/"))) | .number] | .[]'); then
            echo "::error::Could not list open autoblog PRs — refusing to refresh without a complete exclusion list."
            exit 1
          fi
          SLUGS=""
          for NUM in $OPEN; do
            if ! FILES=$(gh api "/repos/${{ github.repository }}/pulls/${NUM}/files" --paginate --jq '.[].filename'); then
              echo "::error::Could not list files for PR #${NUM} — refusing to refresh without a complete exclusion list."
              exit 1
            fi
            for FILE in $(grep -E '^content/blog/.*\.mdx$' <<<"$FILES" || true); do
              SLUGS="${SLUGS:+$SLUGS,}$(basename "$FILE" .mdx)"
            done
          done
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Excluded (open PRs): ${SLUGS:-none}"

      - name: Pick the post and write the prompt
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          BLOG_REFRESH_EXCLUDE_SLUGS: ${{ steps.pending.outputs.slugs }}
          BLOG_REFRESH_PROMPT_OUT: ${{ runner.temp }}/refresh-brief/prompt.md
        run: |
          set -euo pipefail
          BLOG_GENERATOR_DATE=$(TZ=America/Los_Angeles date '+%Y-%m-%dT%H:%M:%S%:z')
          export BLOG_GENERATOR_DATE
          mkdir -p "$RUNNER_TEMP/refresh-brief"
          npm run blog:refresh
          RUN_DATE=${BLOG_GENERATOR_DATE%%T*}
          cp "data/blog-refresh-runs/${RUN_DATE}.json" "$RUNNER_TEMP/refresh-brief/brief.json"
          jq -r '"\(.runDate) \(.status) \(.slug // "") \(.reason // "")"' "$RUNNER_TEMP/refresh-brief/brief.json"

      # One orphan commit, force-pushed: the branch only ever holds the latest
      # brief. Pushed with GITHUB_TOKEN, which raises no workflow events.
      - name: Publish to the autoblog-refresh-brief branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/refresh-brief"
          cat > "$OUT/README.md" <<'EOF'
          # autoblog-refresh-brief

          Written by `.github/workflows/blog-refresh.yml` when the Monday Claude
          routine asks for it. Read by `npm run autoblog:claude -- refresh-brief`.
          Force-pushed; do not branch from it or merge it.
          EOF
          echo '{ "git": { "deploymentEnabled": false } }' > "$OUT/vercel.json"
          cd "$OUT"
          git init -q
          git checkout -q -b autoblog-refresh-brief
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "refresh brief: $(jq -r '.runDate + " " + .status + " " + (.slug // "")' brief.json)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/autoblog-refresh-brief

  finalize:
    name: Apply the session's refresh and open the PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the handoff
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read the handoff
        id: handoff
        run: |
          set -euo pipefail
          IN=data/blog-refresh-inbox
          for f in brief.json answer.json review.json; do
            test -f "$IN/$f" || { echo "::error::$IN/$f is missing from the handoff."; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/inbox"
          cp "$IN"/*.json "$RUNNER_TEMP/inbox/"
          {
            echo "run_date=$(jq -r .runDate "$IN/brief.json")"
            echo "slug=$(jq -r .slug "$IN/brief.json")"
            echo "pass=$(jq -r '.pass == true' "$IN/review.json")"
            echo "generator=$(jq -r '.generatorSha // empty' "$IN/review.json")"
            echo "preview=$(jq -r '.preview // empty' "$IN/review.json")"
            # The verdict is bound to the answer it graded (sha256 of the file's
            # bytes, as refresh-review records it); an answer edited since is
            # not covered, whatever `.pass` says.
            if [ "$(sha256sum "$IN/answer.json" | cut -d' ' -f1)" = "$(jq -r '.answer // empty' "$IN/review.json")" ]; then
              echo "answer_reviewed=true"
            else
              echo "answer_reviewed=false"
            fi
            echo "handoff=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The refresh is applied to the revision of main the session previewed
      # and the reviewer graded (`generatorSha`), never to whatever else the
      # handoff branch carries: newer refresh code, rubric or link policy
      # would publish text nobody reviewed. Anything else falls back to main
      # and counts as a failed review (the PR is held, and `publish` closes it).
      - name: Start from the reviewed revision of main
        id: base
        env:
          GEN: ${{ steps.handoff.outputs.generator }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          if [[ "$GEN" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${GEN}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$GEN" origin/main; then
            git checkout -q -B refresh-finalize "$GEN"
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The handoff's generatorSha '${GEN:-none}' is not a commit on main; applying on main and treating the review as failed."
            git checkout -q -B refresh-finalize origin/main
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the answer
        env:
          BLOG_REFRESH_BRIEF: ${{ runner.temp }}/inbox/brief.json
          BLOG_REFRESH_ANSWER: ${{ runner.temp }}/inbox/answer.json
          BLOG_REFRESH_EXPECT_PREVIEW: ${{ steps.handoff.outputs.preview }}
        run: npm run blog:refresh

      - name: Read the run report
        id: report
        env:
          RUN_DATE: ${{ steps.handoff.outputs.run_date }}
        run: |
          set -euo pipefail
          REPORT="data/blog-refresh-runs/${RUN_DATE}.json"
          test -f "$REPORT"
          # The session's review travels with the report the PR carries.
          jq --slurpfile r "$RUNNER_TEMP/inbox/review.json" '. + {claudeReview: $r[0]}' "$REPORT" > "$REPORT.tmp"
          mv "$REPORT.tmp" "$REPORT"
          {
            echo "status=$(jq -r '.status' "$REPORT")"
            echo "reviewed_preview=$(jq -r '.reviewedPreview // "unchecked"' "$REPORT")"
            echo "report=$REPORT"
          } >> "$GITHUB_OUTPUT"
          jq -r '.status, (.reason // "")' "$REPORT"

      - name: Commit, mark finalized and open the PR
        if: steps.report.outputs.status == 'refreshed'
        env:
          GH_TOKEN: ${{ secrets.AUTOBLOG_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AUTOBLOG_PAT != '' }}
          LABEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DATE: ${{ steps.handoff.outputs.run_date }}
          SLUG: ${{ steps.handoff.outputs.slug }}
          REPORT: ${{ steps.report.outputs.report }}
          # The session's verdict covers this post only when it is the preview
          # it graded, built from the same revision.
          PASS: ${{ steps.handoff.outputs.pass == 'true' && steps.handoff.outputs.answer_reviewed == 'true' && steps.base.outputs.pinned == 'true' && steps.report.outputs.reviewed_preview == 'match' }}
          SESSION_PASS: ${{ steps.handoff.outputs.pass }}
          HANDOFF: ${{ steps.handoff.outputs.handoff }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${HAS_PAT}" != "true" ]; then
            echo "::error::AUTOBLOG_PAT is not configured; a PR opened with GITHUB_TOKEN would never receive CI or review. The handoff on $BRANCH is kept."
            exit 1
          fi
          PR_TITLE="Blog refresh: ${RUN_DATE} ${SLUG}"
          BODY_FILE=$(mktemp)
          {
            echo "## Weekly Refresh of a Ranking Post"
            echo
            echo "- Post: \`/blog/${SLUG}\`"
            echo "- Changed: $(jq -r '.changedFields | join(", ")' "$REPORT")"
            echo "- Opportunity score: $(jq -r '.opportunity // 0 | floor' "$REPORT")"
            echo
            echo "### Search Console queries this URL ranks for (90 days)"
            jq -r '.queries[] | "- `\(.query)` — \(.impressions) impressions, position \(.position | . * 10 | round / 10)"' "$REPORT"
            echo
            echo "### What changed"
            jq -r '.changeNotes // "(no notes)"' "$REPORT"
            echo
            echo "### Claude review (separate subagent)"
            if [ "$PASS" = "true" ]; then echo "✅ Passed."
            elif [ "$SESSION_PASS" = "true" ]; then echo "❌ Not covered: this post is not the preview the session's reviewer graded (the answer changed after the review, another revision of main, or different output)."
            else echo "❌ Failed — see \`claudeReview\` in \`${REPORT}\`."; fi
            jq -r '.claudeReview.summary // empty' "$REPORT"
            echo
            echo "Written by the scheduled Claude session (no API key). The publish date is unchanged; \`updated:\` is set to ${RUN_DATE}."
          } > "$BODY_FILE"

          if ! EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number'); then
            echo "::error::Could not list PRs for $BRANCH."
            exit 1
          fi
          if [ -n "$EXISTING_PR" ]; then
            # Take the old head off the merge path BEFORE it is replaced, as
            # blog-finalize does: the review job re-applies the label to the
            # new head if it earns it.
            gh pr edit "$EXISTING_PR" --remove-label autoblog-approved-pending || true
            if gh pr view "$EXISTING_PR" --json labels --jq '.labels[].name' | grep -qx autoblog-approved-pending; then
              echo "::error::Could not remove autoblog-approved-pending from #$EXISTING_PR; not replacing an approved head."
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/ data/blog-refresh-runs/
          # The trailer names the handoff this commit finalizes, so a re-run
          # of this job (a status or PR call failed after the push) can tell
          # its own earlier result from someone else's push.
          git commit -q -m "Refresh ${SLUG} against its Search Console queries (${RUN_DATE})" -m "Refresh-Handoff: ${HANDOFF}"
          # The finalized branch is main + this commit, replacing the handoff.
          # Leased on the handoff: a newer push to the branch is never overwritten.
          LEASE="$HANDOFF"
          REMOTE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
          if [ -n "$REMOTE" ] && [ "$REMOTE" != "$HANDOFF" ]; then
            git fetch -q origin "refs/heads/${BRANCH}"
            if [ "$(git rev-parse FETCH_HEAD)" = "$REMOTE" ] \
              && git log -1 --format=%B "$REMOTE" | grep -qx "Refresh-Handoff: ${HANDOFF}"; then
              echo "Re-run: ${BRANCH} already holds this handoff's finalized commit ${REMOTE:0:12}; replacing it."
              LEASE="$REMOTE"
            fi
          fi
          git push --force-with-lease="refs/heads/${BRANCH}:${LEASE}" origin "HEAD:refs/heads/${BRANCH}"
          GH_TOKEN="$LABEL_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=autoblog/finalized \
            -f description="Finalized from Claude refresh handoff (handoff=${HANDOFF:0:12})" >/dev/null

          for L in "autoblog:0E8A16:Auto-generated blog post" "autoblog-refresh:1D76DB:Weekly refresh of a ranking post" \
                   "autoblog-claude-reviewed:5319E7:Written and reviewed in the scheduled Claude session" \
                   "autoblog-review-failed:B60205:Failed the autoblog review"; do
            IFS=: read -r NAME COLOR DESC <<<"$L"
            GH_TOKEN="$LABEL_TOKEN" gh label create "$NAME" --color "$COLOR" --description "$DESC" >/dev/null 2>&1 || true
          done
          LABELS=(--label autoblog --label autoblog-refresh --label autoblog-claude-reviewed)
          [ "$PASS" = "true" ] || LABELS+=(--label autoblog-review-failed)

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file "$BODY_FILE" "${LABELS[@]/--label/--add-label}"
            # `--add-label` never clears the previous finalize's verdict: a
            # passing handoff drops any earlier failure (overridden or not),
            # and a failing one drops an override that approved another head.
            if [ "$PASS" = "true" ]; then
              gh pr edit "$EXISTING_PR" --remove-label autoblog-review-failed || true
            fi
            gh pr edit "$EXISTING_PR" --remove-label autoblog-review-failed-overridden || true
            # A GITHUB_TOKEN push raises no pull_request event; re-raise one
            # so CI and review see the new head.
            gh pr close "$EXISTING_PR" && gh pr reopen "$EXISTING_PR"
            # Codex reviewed the previous head. The SHA marker binds its 👍 to
            # this one (autoblog-merge-pending, `publish`), as blog-finalize does.
            gh pr comment "$EXISTING_PR" --body "$(printf '@codex review\n\n<!-- autoblog-codex-heal-head: %s -->' "$(git rev-parse HEAD)")" \
              || echo "::warning::Could not ask Codex to review the new head of #$EXISTING_PR."
          else
            gh pr create --draft --base main --head "$BRANCH" "${LABELS[@]}" --title "$PR_TITLE" --body-file "$BODY_FILE"
          fi
