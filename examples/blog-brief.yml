# Drop-in template for consumer repos (promaxhvac.com, hvacpulse.com).
# Place at: .github/workflows/blog-brief.yml
#
# Daily brief for the Claude autoblog session. No LLM calls.
#
# The scheduled Claude session (see AUTOBLOG_CLAUDE.md) runs in a cloud
# container that reaches only GitHub and npm. Everything that needs the open
# network or a secret is gathered here instead: season, Open-Meteo weather and
# AQI, the Search Console signal and opportunities, this site's published and
# pending posts, the sibling site's posts, the recent category mix, the rubric
# text, the link policy, and an Autocomplete cache for likely topic heads.
#
# The brief is committed to the side branch `autoblog-brief` as a single
# force-pushed commit (brief.json). Never to main.
#
# Timing: the Pulse session runs at 1:37 AM PT, after the subscription's usage
# limits reset. This runs at 08:03 UTC, which is 1:03 AM PDT / 12:03 AM PST:
# after Pacific midnight in both seasons, so the brief carries today's date,
# with half an hour of cron lag to spare before the session.
# A late or missing brief is not fatal: the session warns and refreshes the
# post lists from git itself.
name: Blog Brief (Claude autoblog)

on:
  schedule:
    - cron: "3 8 * * *"
  workflow_dispatch:

concurrency:
  group: blog-brief
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  brief:
    name: Build and publish the brief
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets cannot be tested in a step `if:`; job env can carry the check.
      HAS_SIBLING_TOKEN: ${{ secrets.AUTOBLOG_SIBLING_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same admission rule as generate-blog-post.yml: the `autoblog` label or
      # an `autoblog/*` head. Only ADDED blog files count — a refresh PR edits
      # an existing post and is not a new topic. Advisory: a failure here
      # leaves the session with the disk list plus its own branch scan.
      - name: Collect posts pending in open autoblog PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/pending"
          gh pr list --state open --limit 500 --json number,labels,headRefName \
            --jq '.[] | select((.labels | map(.name) | index("autoblog")) or (.headRefName | startswith("autoblog/")) or (.headRefName | startswith("blog/claude-"))) | "\(.number) \(.headRefName)"' > pending-prs.txt || true
          while read -r NUM REF; do
            [ -n "$NUM" ] || continue
            gh api "/repos/${{ github.repository }}/pulls/${NUM}/files" --paginate \
              --jq '.[] | select(.status == "added") | .filename' 2>/dev/null \
              | grep -E '^content/blog/.*\.mdx$' \
              | while read -r FILE; do
                  gh api "/repos/${{ github.repository }}/contents/${FILE}?ref=${REF}" \
                    --jq '.content' 2>/dev/null | base64 -d > "$RUNNER_TEMP/pending/$(basename "$FILE")" \
                    && echo "pending: #$NUM $FILE" || rm -f "$RUNNER_TEMP/pending/$(basename "$FILE")"
                done
          done < pending-prs.txt
          rm -f pending-prs.txt

      # Both sites serve the Sacramento market, so topics dedup across both.
      # The sibling repo is private: with AUTOBLOG_SIBLING_TOKEN (a read-only
      # token for emelianovsergei/promax-website: Contents + Pull requests
      # read) the brief gets its titles and open autoblog PRs. Without it,
      # brief.ts falls back to the sibling's public sitemap (slugs only).
      - name: Check out sibling posts
        id: sibling
        if: env.HAS_SIBLING_TOKEN == 'true'
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: emelianovsergei/promax-website
          token: ${{ secrets.AUTOBLOG_SIBLING_TOKEN }}
          path: .sibling
          sparse-checkout: content/blog
          persist-credentials: false

      - name: Collect sibling pending posts
        if: steps.sibling.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTOBLOG_SIBLING_TOKEN }}
          SIBLING: emelianovsergei/promax-website
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/sibling-pending"
          gh pr list --repo "$SIBLING" --state open --limit 500 --json number,labels,headRefName \
            --jq '.[] | select((.labels | map(.name) | index("autoblog")) or (.headRefName | startswith("autoblog/")) or (.headRefName | startswith("blog/claude-"))) | "\(.number) \(.headRefName)"' > sib-prs.txt || true
          while read -r NUM REF; do
            [ -n "$NUM" ] || continue
            gh api "/repos/${SIBLING}/pulls/${NUM}/files" --paginate \
              --jq '.[] | select(.status == "added") | .filename' 2>/dev/null \
              | grep -E '^content/blog/.*\.mdx$' \
              | while read -r FILE; do
                  gh api "/repos/${SIBLING}/contents/${FILE}?ref=${REF}" \
                    --jq '.content' 2>/dev/null | base64 -d > "$RUNNER_TEMP/sibling-pending/$(basename "$FILE")" \
                    || rm -f "$RUNNER_TEMP/sibling-pending/$(basename "$FILE")"
                done
          done < sib-prs.txt
          rm -f sib-prs.txt
          ls "$RUNNER_TEMP/sibling-pending" || true

      - name: Build brief
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          BRIEF_PENDING_DIR: ${{ runner.temp }}/pending
          BRIEF_SIBLING_DIR: ${{ steps.sibling.outcome == 'success' && '.sibling/content/blog' || '' }}
          BRIEF_SIBLING_PENDING_DIR: ${{ steps.sibling.outcome == 'success' && format('{0}/sibling-pending', runner.temp) || '' }}
        run: npm run autoblog:brief -- --out "$RUNNER_TEMP/brief-out/brief.json"

      # One orphan commit, force-pushed: the branch only ever holds the latest
      # brief, so it never grows and never shares history with main. Pushed
      # with GITHUB_TOKEN, which raises no workflow events.
      - name: Publish to the autoblog-brief branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/brief-out"
          cat > "$OUT/README.md" <<'EOF'
          # autoblog-brief

          Written daily by `.github/workflows/blog-brief.yml` on `main`. Read by
          the scheduled Claude autoblog session (`AUTOBLOG_CLAUDE.md`). Force-pushed;
          do not branch from it or merge it.
          EOF
          cd "$OUT"
          git init -q
          git checkout -q -b autoblog-brief
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brief.json README.md
          git commit -q -m "brief: $(jq -r .runDate brief.json) ($(jq -r .gsc.status brief.json) GSC, $(jq -r '.gsc.opportunities | length' brief.json) opportunities)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/autoblog-brief
          echo "Published brief for $(jq -r .runDate brief.json) to autoblog-brief."
