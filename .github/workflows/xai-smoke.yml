# Live xAI smoke test (scripts/xai-smoke.ts): discovery, plain text, JSON
# mode with the production reviewSchema, truncation, and the
# reasoning_effort probe — against the real api.x.ai.
#
# Runs only when the XAI_API_KEY secret is available. Secrets cannot be
# read in `if:` expressions, so a job-level env + first-step gate writes a
# step output; on forks / secretless PRs every API-touching step skips and
# the job ends green with zero API calls. Deliberately a separate workflow
# from ci.yml: `tests` there is a required check and must keep running on
# every PR, while this one is path-filtered to the adapter. Do NOT mark
# this job as a required check.

name: xAI smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/xai.ts"
      - "scripts/xai-smoke.ts"

concurrency:
  group: xai-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xai-smoke:
    name: xai-smoke
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - id: gate
        name: Check for XAI_API_KEY
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "XAI_API_KEY not available (fork or unset secret); skipping live smoke."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npm run smoke:xai
