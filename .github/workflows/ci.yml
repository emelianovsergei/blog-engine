# PR gate: builds the package and runs the full test suite.
#
# To make this a hard merge-block, enable branch protection on `main`
# (Settings -> Branches -> Add rule) with:
#   - "Require status checks to pass before merging" -> select `tests`.
#   - "Require branches to be up to date before merging" (optional).
# This is a one-time UI step; once set, GitHub physically blocks merge
# of any PR whose `tests` job has not succeeded against the latest head.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
